plugins {
    id "com.android.application"
}

android {
    namespace "com.mrnaddu.kyc"
    compileSdk 35

    defaultConfig {
        applicationId "com.mrnaddu.kyc"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    sourceSets {
        main.assets.srcDirs = ["../public"]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
