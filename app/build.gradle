plugins {
    id "com.android.application"
}

android {
    namespace "com.mrnaddu.kyc"
    compileSdk 35

    defaultConfig {
        applicationId "com.mrnaddu.kyc"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    sourceSets {
        main.assets.srcDirs = ["../public"]
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: "missing-release-key.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.12.1"
}
