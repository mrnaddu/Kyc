name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kyc-release.jks"

      - name: Build signed installable APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kyc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Name release artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-development}"
          cp app/build/outputs/apk/release/app-release.apk "Karnataka-eKYC-${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karnataka-eKYC-APK
          path: Karnataka-eKYC-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nanna Seva ${{ github.ref_name }} (Pure Native Android)
          body: |
            100% Pure Native Android APK (built with Jetpack Compose & Material 3, zero WebViews).
            
            Features:
            - Pure Native Android Material 3 UI & Architecture (No WebViews)
            - Nanna Seva (ನನ್ನ ಸೇವೆ) bilingual Kannada & English support
            - Ration Card e-KYC verification with live Ahara ePDS integration
            - Within-Karnataka Ration Card & Fair Price Shop Transfer Guide (Sakala)
            - Official UIDAI Aadhaar Update Hub & NPCI bank seeding check
            - Native Captcha Generator & Biometric camera capture
          files: Karnataka-eKYC-*.apk
